name: cefb_app
description: "Christ Embassy Farmers Branch Official Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  video_player: ^2.9.2
  chewie: ^1.8.5
  youtube_player_flutter: ^9.1.1
  url_launcher: ^6.3.1
  translator: ^1.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  http: ^1.2.2
  device_info_plus: ^11.1.0
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  web: ^1.0.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/gallery/
    - assets/images/events/
    - assets/videos/
